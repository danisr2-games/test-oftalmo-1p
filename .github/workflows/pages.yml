name: Publica i tanca el test
on:
  push:
    branches: [main]
  schedule:
    - cron: '5 23 4 11 *'    # 5 minuts després del tancament
    - cron: '0 6 * * *'      # comprovació diària de reserva
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Si ja ha passat la data, deixa només la pàgina d'accés tancat i esborra l'historial
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-11-04T23:00:00Z' +%s)" ]; then
            cp tancat.html /tmp/index.html
            git checkout --orphan tancat
            git rm -rf --quiet .
            cp /tmp/index.html index.html
            touch .nojekyll
            git add index.html .nojekyll
            git -c user.name="tanca-acces" -c user.email="tanca-acces@users.noreply.github.com" commit -m "Accés tancat el 5 de novembre de 2026"
            git push --force origin tancat:main
          fi
          mkdir -p _site && cp index.html _site/ && touch _site/.nojekyll && for f in sw.js fons.mp4 fons_v.mp4 manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png; do [ -f "$f" ] && cp "$f" _site/ || true; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
